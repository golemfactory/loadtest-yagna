[tool.poetry]
name = "loadtests"
version = "0.1.0"
description = "Stress test for Yagna and Arkiv"
authors = ["GolemFactory <contact@golem.network>"]
package-mode = false

packages = [
    { include = "arkiv", from = "." },
    { include = "golem", from = "." },
]

[tool.poetry.dependencies]
python = "^3.12"

# Common dependencies (used by both golem and arkiv)
locust = "^2.37.14"

# Golem-specific dependencies
pydantic = "^2.11.7"
requests = "^2.32.4"
prometheus-client = "^0.22.1"
python-dotenv = "^1.1.1"

# Arkiv-specific dependencies
golem-base-sdk = ">=0.0.7,<0.0.8"
environs = ">=14.2.0,<15.0.0"
testcontainers = ">=4.12.0,<5.0.0"
web3 = "^7.14.0"
eth-account = "^0.13.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.locust]
host = "http://localhost:8545"
users = 5
